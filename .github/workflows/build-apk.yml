name: Build ProjectorArt APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip ProjectorArt
        run: unzip -q "ProjectorArt-source (1).zip" -d .

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK commandline tools and required packages
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "Using ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip curl

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          curl -fSL -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools"/* \
             "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          # GITHUB_PATH only affects later workflow steps, so export PATH above
          # as well; otherwise sdkmanager is invisible in this same shell.
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          # Make SDK discovery unambiguous for the Android Gradle Plugin.
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$GITHUB_WORKSPACE/ProjectorArt/local.properties"

          sdkmanager --version
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.5.1'

      - name: Build debug APK
        working-directory: ProjectorArt
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectorArt-debug-apk
          path: ProjectorArt/app/build/outputs/apk/**/debug/*.apk
