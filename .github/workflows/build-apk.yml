name: Build ProjectorArt APK

on:
  workflow_dispatch: {}

env:
  ANDROID_SDK_ROOT: $HOME/Android/Sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip ProjectorArt
        run: unzip -q "ProjectorArt-source (1).zip" -d .

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK commandline tools and required packages
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip curl
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          # download command-line tools; update URL if Google changes it
          curl -fSL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv "$ANDROID_SDK_ROOT/cmdline-tools"/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          # ensure sdkmanager is usable in this same step, accept licenses, and install needed packages
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Make Gradle wrapper executable (if present)
        run: |
          if [ -f ProjectorArt/gradlew ]; then
            chmod +x ProjectorArt/gradlew
          fi

      - name: Build debug APK
        working-directory: ProjectorArt
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectorArt-debug-apk
          path: ProjectorArt/app/build/outputs/apk/**/debug/*.apk
