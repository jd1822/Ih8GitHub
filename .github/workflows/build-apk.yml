name: Build ProjectorArt APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip ProjectorArt
        run: unzip -q "ProjectorArt-source (1).zip" -d .

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK & required build tools
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          build-tools: '33.0.2'
          force-avd-creation: false

      - name: Make Gradle wrapper executable (if present)
        run: |
          if [ -f ProjectorArt/gradlew ]; then
            chmod +x ProjectorArt/gradlew
          fi

      - name: Build debug APK
        working-directory: ProjectorArt
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectorArt-debug-apk
          path: ProjectorArt/app/build/outputs/apk/**/debug/*.apk
